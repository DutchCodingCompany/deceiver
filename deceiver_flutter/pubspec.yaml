name: deceiver_flutter
description: >-
  A Flutter debug control panel for the Deceiver HTTP mocking library.
  Toggle mocks on/off at runtime, switch between strict and passthrough
  modes, and manage individual mock registrations from a Material UI panel.
version: 0.2.0
repository: https://github.com/DutchCodingCompany/deceiver
resolution: workspace
topics:
  - http
  - testing
  - mock
  - debugging

environment:
  sdk: ^3.9.2
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  deceiver: 0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  http: ^1.5.0
